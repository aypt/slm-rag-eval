services:
  api:
    build: .
    image: slm-rag-eval:latest
    env_file: .env
    environment:
      # The API only serves HTTP here; the worker runs as its own service below.
      WORKER_EMBEDDED: "0"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      # Waits for the model pull to finish, not merely for the container to exist. Starting
      # on service_started meant a job submitted during a multi-gigabyte pull exhausted its
      # retries against a server that had no model yet, and failed for no visible reason.
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    image: slm-rag-eval:latest
    env_file: .env
    command: ["python", "-m", "slm_rag_eval.service.worker"]
    # The image's HEALTHCHECK probes /healthz, which only the api service serves. Left
    # inherited, this container would report unhealthy forever and block anything that
    # waits on service_healthy.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: slmeval
      POSTGRES_PASSWORD: slmeval
      POSTGRES_DB: slmeval
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slmeval -d slmeval"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # A GPU is granted by docker-compose.gpu.yml rather than here, so this file still comes
    # up on a host without the NVIDIA container toolkit:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d

  ollama-init:
    image: ollama/ollama
    env_file: .env
    depends_on:
      ollama:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: ['until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull "$${JUDGE_MODEL}"']
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

volumes:
  pgdata:
  ollama:

name: CI

on:
  push:
  pull_request:

jobs:

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build only: compose needs a judge model and a database, which CI does not run.
      - run: docker build --tag slm-rag-eval:ci .
      # compose reads `env_file: .env`, which is gitignored; the example is its template.
      - run: cp .env.example .env
      - run: docker compose config --quiet

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-rag-eval"
version = "0.1.0"
description = "Privacy-preserving RAG faithfulness evaluation using small language models (SLMs) as judges"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "spacy>=3.7",
  "typer>=0.12",
  "tenacity>=8.3",
]

[project.optional-dependencies]
# The compose deployment points DATABASE_URL at Postgres, which needs an async driver.
# Kept optional so a local SQLite install stays small.
postgres = [
  "asyncpg>=0.29",
]
demo = [
  "streamlit>=1.36",
]
analysis = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "pyyaml>=6",
]

[project.scripts]
rageval = "slm_rag_eval.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["slm_rag_eval"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false

# M10 hardening: the evaluation core must be fully annotated. This only ADDS strictness
# (see AGENTS.md "Never weaken verification"); nothing here relaxes an existing check.
[[tool.mypy.overrides]]
module = [
  "slm_rag_eval.core.*",
  "slm_rag_eval.llm.*",
  "slm_rag_eval.metrics.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
